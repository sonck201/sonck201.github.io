<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wingtip Hearts · Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../_base.css" />
  </head>
  <body class="bg-white text-slate-800">
    <div class="flex h-full flex-col">
      <!-- iOS status bar -->
      <div class="flex h-11 shrink-0 items-center justify-between px-7 text-[15px] font-semibold text-slate-900">
        <span>9:41</span>
        <span class="flex items-center gap-1.5 text-xs">
          <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#0f172a"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#0f172a"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#0f172a"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#0f172a"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 10.5 L5.6 8 A3.4 3.4 0 0 1 10.4 8 Z M3.4 5.8 A6.6 6.6 0 0 1 12.6 5.8 L11.3 7.1 A4.8 4.8 0 0 0 4.7 7.1 Z M1.2 3.6 A9.7 9.7 0 0 1 14.8 3.6 L13.5 4.9 A7.9 7.9 0 0 0 2.5 4.9 Z" fill="#0f172a"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#0f172a" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#0f172a"/><rect x="23.5" y="4" width="1.8" height="4" rx=".9" fill="#0f172a" opacity=".4"/></svg>
        </span>
      </div>
      <!-- Thread header -->
      <div class="flex items-center gap-3 border-b border-slate-100 px-4 pb-3 pt-1">
        <span class="text-2xl text-rose-500">‹</span>
        <div class="relative">
          <div class="ph ph-rose h-10 w-10 rounded-full"></div>
          <span class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-white bg-emerald-500"></span>
        </div>
        <div class="flex-1">
          <div class="flex items-center gap-1.5 font-bold text-slate-900">Mia <span class="grid h-4 w-4 place-items-center rounded-full bg-sky-500 text-[9px] text-white">✓</span></div>
          <div class="text-xs text-emerald-600">Active now</div>
        </div>
        <span class="grid h-9 w-9 place-items-center rounded-full bg-rose-50 text-rose-500">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
        </span>
        <span class="grid h-9 w-9 place-items-center rounded-full bg-slate-50 text-slate-500">⋯</span>
      </div>

      <!-- Messages -->
      <div class="min-h-0 flex-1 overflow-hidden bg-gradient-to-b from-rose-50/60 to-white px-4 py-3 text-[14px] leading-snug">
        <div class="flex items-end gap-2">
          <div class="ph ph-rose h-7 w-7 shrink-0 rounded-full"></div>
          <div class="max-w-[72%] rounded-2xl rounded-bl-md bg-slate-100 px-3.5 py-1.5">Is that a film camera in your 3rd photo? 📷</div>
        </div>
        <div class="mt-2 flex justify-end">
          <div class="max-w-[72%] rounded-2xl rounded-br-md bg-rose-500 px-3.5 py-1.5 text-white">Guilty! An old rangefinder, one roll a month</div>
        </div>

        <div class="my-3 flex items-center gap-3 text-[11px] font-semibold uppercase tracking-wide text-slate-400">
          <span class="h-px flex-1 bg-slate-200"></span>Today<span class="h-px flex-1 bg-slate-200"></span>
        </div>

        <div class="flex items-end gap-2">
          <div class="ph ph-rose h-7 w-7 shrink-0 rounded-full"></div>
          <div class="max-w-[72%] rounded-2xl rounded-bl-md bg-slate-100 px-3.5 py-1.5">Photo walk by the river on Sunday? You could teach me</div>
        </div>
        <div class="mt-2 flex justify-end">
          <div class="ph ph-warm h-16 w-36 rounded-2xl rounded-br-md"></div>
        </div>
        <div class="mt-2 flex justify-end">
          <div class="max-w-[72%] rounded-2xl rounded-br-md bg-rose-500 px-3.5 py-1.5 text-white">Yes! View from the bridge, golden hour at 17:30 🌅</div>
        </div>
        <div class="mt-1 flex items-center justify-end gap-1 text-[11px] text-slate-400">
          <span>10:02 · Read</span><span class="ml-1 text-rose-500">♥</span>
        </div>

        <!-- Typing -->
        <div class="mt-3 flex items-end gap-2">
          <div class="ph ph-rose h-7 w-7 shrink-0 rounded-full"></div>
          <div class="flex items-center gap-1 rounded-2xl rounded-bl-md bg-slate-100 px-4 py-3">
            <span class="h-2 w-2 rounded-full bg-slate-400"></span>
            <span class="h-2 w-2 rounded-full bg-slate-300"></span>
            <span class="h-2 w-2 rounded-full bg-slate-200"></span>
          </div>
        </div>
      </div>

      <!-- Quick replies -->
      <div class="flex gap-2 overflow-hidden px-4 pb-2 pt-1 text-xs font-semibold">
        <span class="shrink-0 rounded-full border border-rose-200 bg-rose-50 px-3 py-1.5 text-rose-600">✦ Suggest a meet-up spot</span>
        <span class="shrink-0 rounded-full border border-slate-200 px-3 py-1.5 text-slate-600">Sounds perfect!</span>
        <span class="shrink-0 rounded-full border border-slate-200 px-3 py-1.5 text-slate-600">😊</span>
      </div>

      <!-- Input bar -->
      <div class="flex shrink-0 items-center gap-2 border-t border-slate-100 px-3 pb-8 pt-2.5">
        <span class="grid h-10 w-10 place-items-center rounded-full bg-slate-100 text-slate-500">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
        </span>
        <div class="flex flex-1 items-center rounded-full bg-slate-100 px-4 py-2.5 text-[15px] text-slate-400">
          <span class="flex-1">Message Mia…</span>
          <span class="text-lg">🙂</span>
        </div>
        <span class="grid h-10 w-10 place-items-center rounded-full bg-rose-500 text-white">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20 21 12 3 4v6l12 2-12 2Z"/></svg>
        </span>
      </div>
    </div>
  </body>
</html>
