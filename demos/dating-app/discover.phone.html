<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wingtip Hearts · Discover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../_base.css" />
  </head>
  <body class="bg-rose-50/40 text-slate-800">
    <div class="flex h-full flex-col">
      <!-- iOS status bar -->
      <div class="flex h-11 shrink-0 items-center justify-between px-7 text-[15px] font-semibold text-slate-900">
        <span>9:41</span>
        <span class="flex items-center gap-1.5 text-xs">
          <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#0f172a"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#0f172a"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#0f172a"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#0f172a"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 10.5 L5.6 8 A3.4 3.4 0 0 1 10.4 8 Z M3.4 5.8 A6.6 6.6 0 0 1 12.6 5.8 L11.3 7.1 A4.8 4.8 0 0 0 4.7 7.1 Z M1.2 3.6 A9.7 9.7 0 0 1 14.8 3.6 L13.5 4.9 A7.9 7.9 0 0 0 2.5 4.9 Z" fill="#0f172a"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#0f172a" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#0f172a"/><rect x="23.5" y="4" width="1.8" height="4" rx=".9" fill="#0f172a" opacity=".4"/></svg>
        </span>
      </div>

      <!-- App header -->
      <div class="flex items-center justify-between px-5 pb-2 pt-1">
        <span class="grid h-10 w-10 place-items-center rounded-full bg-white text-slate-600 shadow-sm">⚙︎</span>
        <div class="flex items-center gap-1.5 text-xl font-extrabold text-rose-600">
          <span>♥</span><span class="tracking-tight">Wingtip Hearts</span>
        </div>
        <span class="grid h-10 w-10 place-items-center rounded-full bg-white text-slate-600 shadow-sm">☰</span>
      </div>

      <!-- Card stack -->
      <div class="relative mx-4 mt-2 flex-1">
        <div class="absolute inset-x-6 -bottom-0 top-4 rounded-[28px] bg-rose-200/60"></div>
        <div class="absolute inset-x-3 bottom-2 top-2 rounded-[28px] bg-rose-300/60"></div>
        <div class="ph ph-rose absolute inset-x-0 bottom-4 top-0 overflow-hidden rounded-[28px] shadow-xl">
          <!-- photo progress -->
          <div class="absolute inset-x-4 top-3 flex gap-1.5">
            <span class="h-1 flex-1 rounded-full bg-white"></span>
            <span class="h-1 flex-1 rounded-full bg-white/40"></span>
            <span class="h-1 flex-1 rounded-full bg-white/40"></span>
            <span class="h-1 flex-1 rounded-full bg-white/40"></span>
          </div>
          <div class="absolute left-4 top-8 rounded-full bg-white/90 px-3 py-1 text-xs font-bold text-rose-600">✦ 92% match</div>
          <!-- like stamp -->
          <div class="absolute right-5 top-16 rotate-12 rounded-lg border-4 border-emerald-400 px-3 py-1 text-2xl font-extrabold tracking-wider text-emerald-400">LIKE</div>

          <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 via-black/40 to-transparent px-5 pb-5 pt-24 text-white">
            <div class="flex items-center gap-2">
              <span class="text-3xl font-extrabold">Mia, 27</span>
              <span class="grid h-6 w-6 place-items-center rounded-full bg-sky-500 text-xs">✓</span>
            </div>
            <div class="mt-1 text-sm text-white/85">📍 3 km away · UX designer</div>
            <div class="mt-3 flex flex-wrap gap-2 text-xs font-semibold">
              <span class="rounded-full bg-white/25 px-3 py-1 backdrop-blur">☕ Coffee walks</span>
              <span class="rounded-full bg-white/25 px-3 py-1 backdrop-blur">🎸 Live music</span>
              <span class="rounded-full bg-white/25 px-3 py-1 backdrop-blur">🥾 Hiking</span>
              <span class="rounded-full bg-white/25 px-3 py-1 backdrop-blur">📷 Film photos</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-center gap-5 py-4">
        <span class="grid h-12 w-12 place-items-center rounded-full bg-white text-lg text-amber-500 shadow-md">↺</span>
        <span class="grid h-16 w-16 place-items-center rounded-full bg-white text-3xl font-bold text-slate-400 shadow-lg">✕</span>
        <span class="grid h-12 w-12 place-items-center rounded-full bg-white text-xl text-sky-500 shadow-md">★</span>
        <span class="grid h-16 w-16 place-items-center rounded-full bg-gradient-to-br from-rose-500 to-pink-500 text-3xl text-white shadow-lg shadow-rose-300">♥</span>
        <span class="grid h-12 w-12 place-items-center rounded-full bg-white text-lg text-violet-500 shadow-md">⚡</span>
      </div>

      <!-- Tab bar -->
      <nav class="flex shrink-0 justify-around border-t border-rose-100 bg-white px-4 pb-7 pt-2 text-[11px] font-semibold text-slate-400">
        <span class="flex flex-col items-center gap-1 text-rose-600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5Z" fill="currentColor"/></svg>Discover</span>
        <span class="relative flex flex-col items-center gap-1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Likes<span class="absolute -right-3 -top-1 rounded-full bg-rose-500 px-1.5 text-[10px] text-white">12</span></span>
        <span class="relative flex flex-col items-center gap-1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4Z" stroke-linejoin="round"/></svg>Chat<span class="absolute -right-1 top-0 h-2.5 w-2.5 rounded-full border-2 border-white bg-rose-500"></span></span>
        <span class="flex flex-col items-center gap-1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Profile</span>
      </nav>
    </div>
  </body>
</html>
